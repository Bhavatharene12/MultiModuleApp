<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_title }} | {{ version_label }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <div class="brand">
    <h1>{{ app_title }}</h1>
    <span class="tag">{{ version_label }}</span>
  </div>
  <nav>
    <a href="{{ url_for('add_student') }}" class="{{ 'active' if request.endpoint == 'add_student' }}">Add Student</a>
    <a href="{{ url_for('students_list') }}" class="{{ 'active' if request.endpoint == 'students_list' }}">Student List</a>
  </nav>
</header>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>24MIS0505 · Multi-module App · Version 1</footer>
</body>
</html>
