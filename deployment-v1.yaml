apiVersion: apps/v1
kind: Deployment
metadata:
  name: multimoduleapp-v1
  labels:
    app: multimoduleapp-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multimoduleapp-v1
  template:
    metadata:
      labels:
        app: multimoduleapp-v1
    spec:
      containers:
        - name: multimoduleapp
          image: bhavatharene12/multimoduleapp:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
